# Build the site and put it on new.illumea.lk (cPanel, sansu.lk account) on every push to main.
#
# FTP rather than a zip through File Manager: the build is ~225 MB, mostly the mirrored
# wp-content uploads, which is over cPanel's upload limit. The action keeps a state file on the
# server and sends only what changed, so after the first run a deploy is the new JS and HTML.
name: Deploy new.illumea.lk

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-new-illumea
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_VERTIK_API: https://dr-malalasekara.vertikworkspace.com/api/shop/v1
          VITE_DEMO_PRODUCTS: '0'

      - uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: ./
